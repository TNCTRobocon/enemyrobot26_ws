shoot_belt_measurement_node:
  ros__parameters:
    action_name: /shoot_belt/execute

    # Linux SocketCAN interface used for direct measurement reception.
    can_interface: can0
    can_error_log_path: /tmp/shoot_belt_measurement_can_rx_error.log
    can_error_log_interval_sec: 1.0
    start_service_name: /shoot_belt_measurement/start
    output_directory: "~/.ros/shoot_belt_measurement"

    action_server_wait_timeout_sec: 10.0
    initial_feedback_max_age_sec: 0.2
    current_zero_epsilon_a: 0.001

    # Detect movement relative to the position sampled at first non-zero current CAN.
    position_change_threshold_mm: 1.0
    position_change_confirmation_samples: 3
